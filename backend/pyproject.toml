[project]
name = "ona-towers-backend"
version = "1.0.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "email-validator==2.2.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "pytest==8.4.1",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
